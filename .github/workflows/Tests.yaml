---

name: Tests

on: [push]

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation libcairo2
      - name: Install Python dependencies
        run: pip install 'flask>=2.3.3,<3' 'pillow>=10,<12' 'cairosvg>=2.7,<3' 'pytest>=7.4,<9' 'pytest-cov>=4.1,<7' 'pytest-mock>=3.11,<4'
      - name: Run tests
        run: pytest
