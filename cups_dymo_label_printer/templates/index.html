<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Dymo Label Designer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script type="application/json" id="stocks-data">{{ label_sizes|tojson }}</script>
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
    <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
</head>
<body>
<div class="app" x-data="designer()" x-cloak @keydown.window="onKey($event)">

    <header class="toolbar" role="toolbar" aria-label="Label settings">
        <h1 class="brand">Label Designer</h1>

        <div class="field grow">
            <label for="label-name">Name</label>
            <input id="label-name" data-testid="name" type="text" maxlength="120"
                   x-model="doc.name" :placeholder="defaultName()">
        </div>

        <div class="field">
            <label for="label-stock">Label stock</label>
            <select id="label-stock" data-testid="stock" x-model="doc.label_size" @change="onStockChange()">
                {% for key, size in label_sizes.items() %}
                <option value="{{ key }}">{{ key }} - {{ size.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <span class="label-text" id="orientation-label">Orientation</span>
            <button type="button" class="btn" data-testid="orientation"
                    aria-labelledby="orientation-label orientation-value"
                    @click="toggleOrientation()">
                <span id="orientation-value" x-text="doc.orientation === 'portrait' ? 'Portrait' : 'Landscape'"></span>
            </button>
        </div>

        <div class="field">
            <label for="label-copies">Copies</label>
            <div class="stepper" role="group" aria-label="Copies">
                <button type="button" class="btn" aria-label="Fewer copies" data-testid="copies-dec"
                        :disabled="doc.copies <= 1" @click="setCopies(doc.copies - 1)">&minus;</button>
                <input id="label-copies" data-testid="copies" type="number" min="1" max="99" inputmode="numeric"
                       :value="doc.copies" @change="setCopies($event.target.value, $event.target)">
                <button type="button" class="btn" aria-label="More copies" data-testid="copies-inc"
                        :disabled="doc.copies >= 99" @click="setCopies(doc.copies + 1)">+</button>
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn" data-testid="save" @click="save()" :disabled="busy">Save</button>
            <button type="button" class="btn primary" data-testid="print" @click="print()" :disabled="busy"
                    title="Ctrl/Cmd+Enter">Print</button>
            <span class="badge" data-testid="printer-badge" :class="printer.ok ? 'ok' : 'err'"
                  role="status" :title="printer.detail">
                <span aria-hidden="true" x-text="printer.ok ? '●' : '▲'"></span>
                <span x-text="printer.text"></span>
            </span>
            <button type="button" class="btn" data-testid="theme" @click="toggleTheme()"
                    :aria-pressed="theme === 'dark' ? 'true' : 'false'" aria-label="Dark mode">
                <span aria-hidden="true" x-text="theme === 'dark' ? 'Dark' : 'Light'"></span>
            </button>
        </div>
    </header>

    <main class="workspace">
        <section class="canvas-pane" aria-label="Label preview">
            <p class="editing" data-testid="editing" aria-live="polite">
                <template x-if="editingId">
                    <span>Editing: <strong x-text="doc.name || 'Untitled'"></strong></span>
                </template>
                <template x-if="!editingId">
                    <span>New label</span>
                </template>
                <span class="unsaved" data-testid="unsaved" x-show="dirty" x-cloak>&bull; Unsaved changes</span>
                <button type="button" class="btn small" x-show="editingId" x-cloak @click="newLabel()">New label</button>
            </p>

            <div class="stage" x-ref="stage">
                <div class="frame" data-testid="frame" x-ref="frame"
                     :style="frameStyle()"
                     :data-stock="doc.label_size" :data-orientation="doc.orientation"
                     @pointerdown.self="deselect()">
                    <img class="render" alt="Rendered label preview" draggable="false"
                         x-show="rendered.image" :src="rendered.image || ''">
                    <p class="empty-hint" x-show="!doc.blocks.length" x-cloak>
                        Empty label - add a text or image block
                    </p>

                    <template x-for="b in doc.blocks" :key="b.id">
                        <div class="overlay" :class="overlayClass(b)" :style="overlayStyle(b)"
                             tabindex="0" role="button"
                             :data-block="b.id" :data-type="b.type"
                             :aria-label="blockLabel(b)"
                             @pointerdown="startDrag($event, b)"
                             @pointermove="onDrag($event)"
                             @pointerup="endDrag($event)"
                             @pointercancel="endDrag($event)"
                             @focus="select(b.id)"
                             @keydown.enter.self.prevent="startEdit(b)">
                            <span class="handle" data-testid="handle" x-show="b.type === 'image' && selected === b.id"
                                  aria-hidden="true"
                                  @pointerdown.stop.prevent="startResize($event, b)"
                                  @pointermove="onResize($event)"
                                  @pointerup="endResize($event)"
                                  @pointercancel="endResize($event)"></span>
                        </div>
                    </template>

                    <textarea class="inplace" data-testid="inplace" x-ref="inplace"
                              x-show="editing" x-cloak
                              aria-label="Edit block text"
                              :style="inplaceStyle()"
                              :value="editing ? (doc.blocks.find(b => b.id === editing) || {}).text : ''"
                              @input="onInplaceInput($event)"
                              @blur="commitEdit()"
                              @keydown.escape.stop.prevent="cancelEdit()"
                              @keydown.ctrl.enter.stop.prevent="commitEdit()"
                              @keydown.meta.enter.stop.prevent="commitEdit()"
                              @pointerdown.stop></textarea>
                </div>
            </div>

            <p class="size-note" data-testid="size-note">
                <span x-text="canvasW + ' x ' + canvasH + ' mm'"></span>
                <span x-show="rendering" x-cloak> - rendering...</span>
            </p>
            <p class="alert" role="alert" data-testid="render-error" x-show="renderError" x-cloak x-text="renderError"></p>
            <ul class="problems" data-testid="problems" aria-label="Layout problems">
                <template x-for="p in problems()" :key="p.key">
                    <li :class="p.kind" x-text="p.text"></li>
                </template>
            </ul>
        </section>

        <aside class="inspector" aria-label="Block inspector">
            <div class="add-row">
                <button type="button" class="btn" data-testid="add-text" @click="addText()">Add text</button>
                <label class="btn file-btn">
                    Upload image
                    <input type="file" data-testid="upload" accept="image/png,image/jpeg,image/svg+xml,.png,.jpg,.jpeg,.svg"
                           @change="onUpload($event)">
                </label>
            </div>

            <details class="icons" data-testid="icons">
                <summary>Icons</summary>
                <div class="icon-grid">
                    <template x-for="ic in icons" :key="ic.name">
                        <button type="button" class="icon-btn" :aria-label="'Add icon ' + ic.name" :title="ic.name"
                                @click="addImage('icon:' + ic.name)">
                            <img :src="ic.url" alt="" width="24" height="24">
                        </button>
                    </template>
                </div>
            </details>

            <h2 class="h2">Blocks</h2>
            <ol class="block-list" data-testid="block-list">
                <template x-for="(b, i) in doc.blocks" :key="b.id">
                    <li :class="{current: selected === b.id}">
                        <button type="button" class="block-pick" :aria-pressed="selected === b.id ? 'true' : 'false'"
                                @click="select(b.id)" x-text="blockLabel(b)"></button>
                        <button type="button" class="btn small" :disabled="i === 0" :aria-label="'Move ' + blockLabel(b) + ' up'"
                                @click="moveBlock(i, -1)">Up</button>
                        <button type="button" class="btn small" :disabled="i === doc.blocks.length - 1"
                                :aria-label="'Move ' + blockLabel(b) + ' down'" @click="moveBlock(i, 1)">Down</button>
                        <button type="button" class="btn small danger" :aria-label="'Delete ' + blockLabel(b)"
                                @click="removeBlock(b.id)">Delete</button>
                    </li>
                </template>
            </ol>
            <p class="muted" x-show="!doc.blocks.length" x-cloak>No blocks yet.</p>

            <div class="props" data-testid="inspector-props">
                <template x-if="!current()">
                    <div>
                        <h2 class="h2">Defaults</h2>
                        <div class="field">
                            <label for="default-font">Font for new text</label>
                            <select id="default-font" data-testid="default-font"
                                    @change="defaultFont = $event.target.value; rememberFont()">
                                <template x-for="f in fonts" :key="f.family">
                                    <option :value="f.family" :selected="f.family === defaultFont" x-text="f.family"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                </template>

                <template x-if="current() && current().type === 'text'">
                    <div>
                        <h2 class="h2">Text block</h2>
                        <div class="field">
                            <label for="p-text">Text</label>
                            <textarea id="p-text" data-testid="p-text" rows="3" x-model="current().text"></textarea>
                        </div>
                        <div class="field">
                            <label for="p-font">Font</label>
                            <select id="p-font" data-testid="p-font"
                                    @change="current().font_family = $event.target.value; onFontChange()">
                                <template x-for="f in fontChoices(current())" :key="f.family">
                                    <option :value="f.family" :selected="f.family === current().font_family" x-text="f.family"></option>
                                </template>
                            </select>
                            <span class="note" x-show="substituted(current())" x-cloak>Font not installed - a substitute is shown.</span>
                        </div>
                        <div class="field">
                            <label for="p-size">Size (pt)</label>
                            <input id="p-size" data-testid="p-size" type="number" step="0.5" min="1" :max="fontCap()"
                                   :value="current().font_size_pt" @change="setSize($event.target.value, $event.target)">
                        </div>
                        <div class="field">
                            <span class="label-text" id="p-style-label">Style</span>
                            <div class="seg" role="group" aria-labelledby="p-style-label">
                                <button type="button" class="btn toggle" data-testid="p-bold" aria-label="Bold"
                                        :aria-pressed="current().bold ? 'true' : 'false'"
                                        :disabled="!styleOk(current(), 'bold')"
                                        :title="styleOk(current(), 'bold') ? 'Bold' : 'This font has no bold style'"
                                        @click="current().bold = !current().bold"><b>B</b></button>
                                <button type="button" class="btn toggle" data-testid="p-italic" aria-label="Italic"
                                        :aria-pressed="current().italic ? 'true' : 'false'"
                                        :disabled="!styleOk(current(), 'italic')"
                                        :title="styleOk(current(), 'italic') ? 'Italic' : 'This font has no italic style'"
                                        @click="current().italic = !current().italic"><i>I</i></button>
                                <button type="button" class="btn toggle" data-testid="p-underline" aria-label="Underline"
                                        :aria-pressed="current().underline ? 'true' : 'false'"
                                        @click="current().underline = !current().underline"><u>U</u></button>
                            </div>
                        </div>
                        <div class="field">
                            <span class="label-text" id="p-align-label">Alignment</span>
                            <div class="seg" role="radiogroup" aria-labelledby="p-align-label">
                                <template x-for="a in ['left', 'center', 'right']" :key="a">
                                    <button type="button" class="btn toggle" role="radio" :data-testid="'p-align-' + a"
                                            :aria-checked="current().align === a ? 'true' : 'false'"
                                            @click="current().align = a" x-text="a.charAt(0).toUpperCase() + a.slice(1)"></button>
                                </template>
                            </div>
                        </div>
                        <div class="field">
                            <label for="p-boxwidth">Box width (mm)</label>
                            <input id="p-boxwidth" data-testid="p-boxwidth" type="number" step="0.5" min="1" :max="canvasW"
                                   placeholder="auto (label width)" :value="current().width_mm === null ? '' : current().width_mm"
                                   @change="setBoxWidth($event.target.value, $event.target)">
                        </div>
                        <label class="check">
                            <input type="checkbox" data-testid="p-shrink" x-model="current().shrink_to_fit">
                            Shrink to fit (down to 6 pt)
                        </label>
                    </div>
                </template>

                <template x-if="current() && current().type === 'image'">
                    <div>
                        <h2 class="h2">Image block</h2>
                        <p class="muted" x-text="current().src"></p>
                        <div class="field">
                            <label for="p-mono">Black and white</label>
                            <select id="p-mono" data-testid="p-mono" x-model="current().mono">
                                <option value="threshold">Threshold</option>
                                <option value="dither">Dither</option>
                            </select>
                        </div>
                        <div class="field" x-show="current().mono === 'threshold'">
                            <label for="p-threshold">Threshold <output x-text="current().threshold"></output></label>
                            <input id="p-threshold" data-testid="p-threshold" type="range" min="0" max="255"
                                   x-model.number="current().threshold">
                        </div>
                        <div class="field">
                            <label for="p-width">Width (mm)</label>
                            <input id="p-width" data-testid="p-width" type="number" step="0.5" min="2" :max="canvasW"
                                   :value="current().width_mm" @change="setImageWidth(current(), $event.target.value, $event.target)">
                        </div>
                    </div>
                </template>
            </div>
        </aside>
    </main>

    <section class="history" aria-label="Saved labels">
        <h2 class="h2 history-head">
            <button type="button" class="collapse" data-testid="history-toggle" id="history-toggle"
                    :aria-expanded="history.open ? 'true' : 'false'" aria-controls="history-body"
                    @click="toggleHistory()">
                <span aria-hidden="true" x-text="history.open ? '▾' : '▸'"></span>
                Saved labels <span class="count" data-testid="history-count" x-text="'(' + history.labels.length + ')'"></span>
            </button>
        </h2>

        <div id="history-body" data-testid="history" x-show="history.open" x-cloak>
            <div class="history-controls">
                <div class="field grow">
                    <label for="h-search">Search</label>
                    <input id="h-search" data-testid="h-search" type="search" placeholder="Name or text"
                           x-model="history.q" @input="scheduleHistory()">
                </div>
                <div class="field">
                    <label for="h-sort">Sort</label>
                    <select id="h-sort" data-testid="h-sort" x-model="history.sort" @change="loadHistory()">
                        <option value="last_printed">Last printed</option>
                        <option value="created">Created</option>
                        <option value="name">Name</option>
                    </select>
                </div>
                <label class="check">
                    <input type="checkbox" data-testid="h-starred" x-model="history.starred" @change="loadHistory()">
                    Starred only
                </label>
                <label class="check">
                    <input type="checkbox" data-testid="h-all" :checked="allSelected()" :disabled="!history.labels.length"
                           @change="toggleAll($event.target.checked)">
                    Select all
                </label>
                <button type="button" class="btn danger" data-testid="h-delete"
                        :disabled="!history.selected.length" @click="deleteSelected()">
                    Delete selected<span x-show="history.selected.length" x-text="' (' + history.selected.length + ')'"></span>
                </button>
            </div>

            <p class="alert" role="alert" x-show="history.error" x-cloak x-text="history.error"></p>
            <p class="muted empty" data-testid="h-empty" x-show="!history.labels.length && !history.loading" x-cloak
               x-text="(history.q || history.starred) ? 'No saved labels match.' : 'No saved labels yet - Save or Print a label to keep it here.'"></p>

            <ul class="label-list" data-testid="label-list">
                <template x-for="l in history.labels" :key="l.id">
                    <li class="label-row" :class="{current: l.id === editingId}" :data-label="l.id">
                        <input type="checkbox" class="row-check" :aria-label="'Select ' + l.name"
                               :checked="history.selected.includes(l.id)" @change="toggleOne(l.id, $event.target.checked)">
                        <img class="thumb" width="140" height="60" loading="lazy"
                             :alt="'Thumbnail of ' + l.name" :src="thumbUrl(l)">
                        <div class="meta">
                            <strong class="name" x-text="l.name"></strong>
                            <span class="muted" x-text="lastPrinted(l)"></span>
                            <span class="muted" x-text="l.label_size + ' - ' + l.orientation + (l.print_count ? ' - printed ' + l.print_count + 'x' : '')"></span>
                        </div>
                        <div class="row-actions">
                            <button type="button" class="btn small star" data-testid="h-star"
                                    :aria-pressed="l.starred ? 'true' : 'false'"
                                    :aria-label="(l.starred ? 'Unstar ' : 'Star ') + l.name"
                                    @click="toggleStar(l)"><span aria-hidden="true" x-text="l.starred ? '★' : '☆'"></span></button>
                            <button type="button" class="btn small" data-testid="h-open" @click="openLabel(l)">Open</button>
                            <button type="button" class="btn small" data-testid="h-dup" @click="duplicateLabel(l)">Duplicate</button>
                            <button type="button" class="btn small" data-testid="h-reprint" @click="reprint(l)">Re-print</button>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </section>

    <div class="toasts" aria-live="polite" aria-atomic="false">
        <template x-for="t in toasts" :key="t.id">
            <div class="toast" :class="t.kind" :role="t.kind === 'error' ? 'alert' : 'status'" data-testid="toast">
                <span x-text="t.text"></span>
                <button type="button" class="toast-x" aria-label="Dismiss" @click="dismiss(t.id)">&times;</button>
            </div>
        </template>
    </div>
</div>
</body>
</html>
