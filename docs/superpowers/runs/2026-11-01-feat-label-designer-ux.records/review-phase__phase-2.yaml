journal:
  - {kind: review, id: p2-review-r1, phase: 2, title: "Phase 2 code review: 8 findings (7 in, 1 out)", body: "A dispatched general-purpose reviewer (superpowers:requesting-code-review template) reviewed ccf3223..f3c61e6 against the spec and plan phase 2, focused on data safety. It ran the suite (244 passed) and probes over 17 odd v1 entries, routes and thumbnail cost. Findings raised: p2-r1 to p2-r7 (in), p2-r8 (out). The orchestrator verified p2-r1, p2-r5 and p2-r6 against store.py and web_app.py; the implementer fixed all seven with tests (suite: 308 passed). A follow-up security review tightened p2-r4: backups take the source file's mode, masked 0o777. The orchestrator also checked that the new `migrated` text-cap exemption is only read from the history file, never from requests."}
  - {kind: finding, id: p2-r1, phase: 2, review_scope: in, title: "v1 migration silently dropped entries failing v2 validation", body: "store.py _migrate_v1_entry/_load_entries skipped on ValueError (font_size over cap, <=0 or null, long text, unknown stock, null copies/text)."}
  - {kind: finding, id: p2-r2, phase: 2, review_scope: in, title: "Non-object JSON body gave HTML 500 on four routes", body: "web_app.py _ids_from_request, star, re-print."}
  - {kind: finding, id: p2-r3, phase: 2, review_scope: in, title: "Thumbnail re-rendered every request, uncacheable", body: "web_app.py thumbnail route: no-cache, no ETag."}
  - {kind: finding, id: p2-r4, phase: 2, review_scope: in, title: "Atomic write left history/backups at 0600", body: "store.py mkstemp mode carried by os.replace."}
  - {kind: finding, id: p2-r5, phase: 2, review_scope: in, title: "Content-match bump ignored printed name/copies and bumped the first match", body: "store.py _content_match/record_print."}
  - {kind: finding, id: p2-r6, phase: 2, review_scope: in, title: "Non-StoreError exceptions after a successful print returned 500", body: "web_app.py /print post-print except was too narrow."}
  - {kind: finding, id: p2-r7, phase: 2, review_scope: in, title: "Sort route tests passed trivially", body: "tests/test_routes_labels.py:91-96."}
  - {kind: finding, id: p2-r8, phase: 2, review_scope: out, title: "History file has no persistent volume; a future volume must mount a directory (os.replace over a single-file bind mount fails with EBUSY)", body: "Same root as sr-14: docker-compose.yml has had no volume since before this change. The EBUSY note constrains the follow-up fix."}
