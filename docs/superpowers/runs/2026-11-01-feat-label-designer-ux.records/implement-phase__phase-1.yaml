  - {kind: discovery, id: p1-d1, phase: 1, title: "Lucide 0.460 renamed two icons", body: "lucide-static 0.460.0 has no home.svg or alert-triangle.svg; shipped upstream names house.svg and triangle-alert.svg (20 real files + ISC LICENSE copied from the npm package)."}
  - {kind: discovery, id: p1-d2, phase: 1, title: "hadolint and CI evidence", body: "hadolint was not installed; installed via brew (2.15.1); hadolint --failure-threshold error Dockerfile exit 0 (warnings only). yamllint ran locally (only a truthy warning on 'on:', same as other workflows). CI on pushed head 2bc5036: Tests green, Build green. Static-Analysis (markdownlint) is red on spec/journal/acceptance-report markdown files that are not phase-1 code."}
  - {kind: discovery, id: p1-d3, phase: 1, title: "pytest needs pythonpath in CI", body: "CI collected no package because the repo root was not on sys.path; added pythonpath = ['.'] to pytest ini options."}
  - {kind: discovery, id: p1-d4, phase: 1, title: "cairosvg sizes from width/height, cairo caps surfaces", body: "cairosvg sizes the canvas from root width/height before viewBox, and cairo refuses surfaces > 32767 px (INVALID_SIZE), so SVG sizing is probed by rasterizing once at 64 px and mapped to ImageTooLarge."}
  - {kind: finding, id: p1-f1, phase: 1, state: open, review_scope: in, title: "unbounded image render dimensions", body: "width_mm/uploads/SVGs could force huge rasters. Fixed: image width_mm <= label long edge, width clamped to canvas, pixel budget (4 Mpx) checked before rasterize/resize, SVG sized by a probe and rendered with fixed output_width/height (aspect cap 50:1), uploads over 25 Mpx refused with 400."}
  - {kind: finding, id: p1-f2, phase: 1, state: open, review_scope: in, title: "stored XSS via uploaded SVG served inline", body: "GET /images/<name> now sends nosniff and a sandboxing CSP on every response, SVG as Content-Disposition attachment; name strictly validated; cairosvg stays in safe mode (test shows external file:// and http image hrefs are not fetched)."}
  - {kind: finding, id: p1-f3, phase: 1, state: open, review_scope: in, title: "render DoS via unbounded document sizes and linear shrink loop", body: "font_size_pt capped at the label long edge in points, text <= 2000 chars, <= 50 lines per block, <= 30 blocks; shrink-to-fit is a 12-iteration binary search over [6 pt, requested]."}
  - {kind: finding, id: p1-f4, phase: 1, state: open, review_scope: in, title: "SVG pixel-budget check bypassable via regex aspect inference", body: "The viewBox/width/height regex disagreed with cairosvg sizing. Regex removed; one probe render gives the real aspect, then output_width and output_height are both fixed by us."}
  - {kind: finding, id: p1-f5, phase: 1, state: open, review_scope: out, title: "Static-Analysis markdownlint is red on generated docs", body: "MD022/MD032/MD060 errors in docs/superpowers specs/journals and docs/acceptance/report_linked.md (tool-generated), not touched by this phase."}
