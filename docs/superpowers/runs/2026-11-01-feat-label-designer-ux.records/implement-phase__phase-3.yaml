journal:
  - {kind: decision, id: p3-dec1, phase: 3, title: "Select options are server-rendered; font selects use :selected", body: "Alpine x-model on a select whose options are created later by x-for loses its value (reload showed the first stock). The stock options are rendered by Jinja and the font selects bind option :selected with an @change handler."}
  - {kind: decision, id: p3-dec2, phase: 3, title: "Text boxes keep width_mm null when dragged; a Box width field was added", body: "Moving a null-width text block shrinks its box (renderer: label width minus x minus margin), so the box is not rigid. A Box width (mm) inspector field (blank = auto) lets a user fix it; the drag-limit evidence uses 25 mm. The keep-1-mm clamp uses the last rendered bbox."}
  - {kind: discovery, id: p3-d1, phase: 3, title: "Alpine 3.14.1 package ships no LICENSE file", body: "npm pack alpinejs@3.14.1 contains dist/cdn.min.js (copied unmodified to static/vendor/alpine.min.js) but no LICENSE; static/vendor/LICENSE carries the MIT text with the upstream copyright line and names the version."}
  - {kind: discovery, id: p3-d2, phase: 3, title: "Dev machine lacks the catalog fonts; matplotlib supplies real DejaVu", body: "scripts/dev_server.py adds matplotlib's bundled DejaVu directory (when importable) to LABEL_FONT_DIRS beside tests/fixtures/fonts, so the capture shows several real families. The capture asserts the limits it shows (drag clamp 56 mm, scale = label width, copies 1/99, no horizontal scroll at 360 px, Ctrl+P prevented plus one /render)."}
  - {kind: discovery, id: p3-d3, phase: 3, title: "Acceptance matrix", body: "ldx-single-ui and ldx-acceptance-doc moved to ci with refs. ldx-live-preview, ldx-history-panel, ldx-ux and ldx-label-name stay not-implemented: they await the orchestrator's visual-evidence acceptance and have no automated browser test in CI (the Playwright capture is not a CI job)."}
resolves: []
